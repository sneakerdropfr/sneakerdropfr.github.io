:root{--bg:#fff;--c2:#f5f5f5;--bor:#e5e5e5;--acc:#FF2D2D;--tx:#0a0a0a;--mu:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
a{color:inherit;text-decoration:none}
header{background:#111;border-bottom:1px solid var(--bor);padding:14px 20px;display:flex;align-items:center;gap:12px}
.back{color:var(--mu);font-size:13px}.back:hover{color:var(--tx)}
header h1{font-size:18px;font-weight:700;flex:1}
.ts{font-size:11px;color:var(--mu)}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--bor);padding:0 20px}
.tb{padding:13px 20px;border:none;background:none;color:var(--mu);font-size:14px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;transition:.2s}
.tb.on{color:var(--acc);border-bottom-color:var(--acc)}.tb:hover{color:var(--tx)}
.tc{display:none;padding:18px 20px}.tc.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.si{flex:1;min-width:160px;max-width:300px;background:var(--c2);border:1px solid var(--bor);border-radius:8px;padding:8px 12px;color:var(--tx);font-size:14px}
.si:focus{outline:none;border-color:var(--acc)}
.ss{background:var(--c2);border:1px solid var(--bor);border-radius:8px;padding:8px 10px;color:var(--tx);font-size:13px;cursor:pointer}
.brands{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.bb{padding:5px 11px;border-radius:20px;border:1px solid var(--bor);background:var(--c2);color:var(--mu);font-size:11px;cursor:pointer;transition:.15s}
.bb.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}.bb:hover{color:var(--tx);border-color:#555}
.cnt{color:var(--mu);font-size:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.card{background:var(--c2);border:1px solid var(--bor);border-radius:10px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:#444}.card a{display:block}
.ci{width:100%;aspect-ratio:1;object-fit:contain;background:#fff;display:block;padding:8px}
.cb{padding:9px 10px}
.cp{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.cn{font-size:12px;font-weight:600;line-height:1.35;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-size:14px;font-weight:800;color:var(--acc)}
.dt{font-size:10px;color:var(--mu);margin-top:3px}
.empty{padding:40px;text-align:center;color:var(--mu)}
footer{text-align:center;padding:28px;color:var(--mu);font-size:12px;border-top:1px solid var(--bor);margin-top:30px}
footer a{color:var(--mu)}
@media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}.tb{padding:11px 13px;font-size:12px}}
</style>

const DATA={bstn:BD,snipes:SN,solebox:SB};
const STA={bstn:{b:'',s:'date'},snipes:{b:'',s:'pa'},solebox:{b:'',s:'pa'}};
function stab(id,el){document.querySelectorAll('.tb').forEach(e=>e.classList.remove('on'));document.querySelectorAll('.tc').forEach(e=>e.classList.remove('on'));el.classList.add('on');document.getElementById('t-'+id).classList.add('on');rdr(id);}
function fb(t,br){STA[t].b=br;document.querySelectorAll('#br-'+t+' .bb').forEach(b=>b.classList.toggle('active',b.dataset.b===br));rdr(t);}
function fmt(p){if(p===''||p==null)return'';return typeof p==='number'?p.toFixed(2).replace('.',',')+' €':p+'';}
function rdr(t){
  const q=(document.getElementById('s-'+t)?.value||'').toLowerCase();
  const s=document.getElementById('o-'+t)?.value||STA[t].s;
  const br=STA[t].b;
  let it=DATA[t].filter(i=>{
    if(br&&i.brand!==br)return false;
    if(q&&!i.name.toLowerCase().includes(q)&&!(i.brand||'').toLowerCase().includes(q))return false;
    return true;
  });
  it.sort((a,b)=>s==='pa'?(a.price||9999)-(b.price||9999):s==='pd'?(b.price||0)-(a.price||0):s==='az'?a.name.localeCompare(b.name,'fr'):(!a.date?1:!b.date?-1:a.date.localeCompare(b.date)));
  document.getElementById('n-'+t).textContent=it.length+' paire'+(it.length>1?'s':'');
  const g=document.getElementById('g-'+t);
  if(!it.length){g.innerHTML='<div class="empty">Aucun résultat</div>';return;}
  g.innerHTML=it.map(i=>{
    const img=i.img?`<img class="ci" src="${i.img}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
    const dt=i.date&&i.date!=='TBD'?`<div class="dt">📅 ${i.date.substring(0,10)}</div>`:'';
    return `<div class="card"><a href="${i.url}" target="_blank" rel="noopener sponsored">${img}<div class="cb"><div class="cp">${i.brand||''}</div><div class="cn">${i.name}</div><div class="pr">${fmt(i.price)}</div>${dt}</div></a></div>`;
  }).join('');
}
rdr('bstn');
