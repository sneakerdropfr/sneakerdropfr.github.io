name: Generate Sitemap

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sitemap.xml'
      - '.github/**'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sitemap
        run: python3 generate_sitemap.py

      - name: Commit sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sitemap: mise a jour automatique [skip ci]"
          file_pattern: sitemap.xml
