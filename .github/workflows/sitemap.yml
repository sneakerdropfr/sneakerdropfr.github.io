name: Generate Sitemap

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sitemap.xml'
      - '.github/**'
      - 'releases.json'
      - 'releases_snapshot.json'
      - 'weekly_data.json'

concurrency:
  group: sitemap
  cancel-in-progress: true

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest
        run: git pull --rebase origin main || true

      - name: Generate sitemap
        run: python3 generate_sitemap.py

      - name: Commit sitemap
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "sitemap: mise a jour automatique [skip ci]"
          file_pattern: sitemap.xml
        continue-on-error: true
