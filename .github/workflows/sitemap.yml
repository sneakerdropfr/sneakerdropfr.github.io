name: Generate Sitemap

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'sitemap.xml'

jobs:
  sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate sitemap
        run: python3 generate_sitemap.py
      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || git commit -m "sitemap: mise a jour automatique [skip ci]"
          git push
