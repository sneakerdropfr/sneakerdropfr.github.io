<script>
function escapeHtml(t) { return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
// Globalement : si une image produit casse (403, hotlink, blocked), on masque la
// card entière dans les listings au lieu d'afficher l'emoji 👟 violet trompeur.
function sdfHideBrokenCard(imgEl) {
  if (!imgEl) return;
  var card = imgEl.closest ? imgEl.closest('.drop-card, .raffle-single, .src') : null;
  if (card && card.parentNode) { card.style.display = 'none'; card.setAttribute('data-broken-image','1'); return; }
  var wrap = imgEl.parentNode;
  if (wrap) wrap.style.display = 'none';
}
function sdfSweepBrokenImages(root) {
  var scope = root || document;
  var imgs = scope.querySelectorAll('.drop-card img, .raffle-single img, .src img');
  for (var i = 0; i < imgs.length; i++) {
    var im = imgs[i];
    if (im.complete) {
      if (im.naturalWidth === 0) sdfHideBrokenCard(im);
    } else {
      im.addEventListener('load', function(e){ if (e.target.naturalWidth === 0) sdfHideBrokenCard(e.target); }, { once: true });
      im.addEventListener('error', function(e){ sdfHideBrokenCard(e.target); }, { once: true });
    }
  }
}
window.sdfHideBrokenCard = sdfHideBrokenCard;
window.sdfSweepBrokenImages = sdfSweepBrokenImages;
document.addEventListener('DOMContentLoaded', function(){
  sdfSweepBrokenImages();
  setTimeout(sdfSweepBrokenImages, 1500);
  setTimeout(sdfSweepBrokenImages, 4000);
});
</script>

    var allReleases=[]; window._releases=[];
    var activeFilter='all';
    var BRAND_MAP={'jordan':['jordan brand','jordan'],'nike':['nike'],'adidas':['adidas'],'new balance':['new balance']};

    function isReleased(dateStr) {
      if (!dateStr || dateStr==='TBD') return false;
      var p=dateStr.split('-');
      if (p.length!==3) return false;
      var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
      var today=new Date(); today.setHours(0,0,0,0);
      return d<today; // strict : le jour J n'est pas "sorti"
    }
    function isFutureOrToday(dateStr) {
      if (!dateStr||dateStr==='TBD') return true;
      return new Date(dateStr+'T23:59:59')>=new Date();
    }
    function isSoon(dateStr) {
      if (!dateStr||dateStr==='TBD') return false;
      var p=dateStr.split('-');
      if (p.length!==3) return false;
      var d=new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2]));
      var now=new Date();
      var day=now.getDay();
      var daysFromMon=day===0?6:day-1;
      var monday=new Date(now); monday.setDate(now.getDate()-daysFromMon); monday.setHours(0,0,0,0);
      var sunday=new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
      return d>=monday&&d<=sunday;
    }
    function matchBrand(r,filter) {
      if (filter==='all') return true;
      var b=(r.brand||'').toLowerCase();
      var keys=BRAND_MAP[filter.toLowerCase()]||[filter.toLowerCase()];
      return keys.some(function(k){ return b.indexOf(k)!==-1; });
    }
    function formatPrice(p) {
      if (!p&&p!==0) return '';
      var s=String(p).trim().replace(/€/g,'').replace(/EUR/gi,'').trim();
      if (!s) return '';
      return s+' €';
    }
    function formatDate(str) {
      if (!str||str==='TBD') return 'Date à confirmer';
      try {
        var parts=str.split('-');
        if (parts.length===3) {
          var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
          return d.toLocaleDateString('fr-FR',{weekday:'short',day:'numeric',month:'long'});
        }
        return str;
      } catch(e){ return str; }
    }
    function sortByDate(arr) {
      return arr.slice().sort(function(a,b){
        var da=a.date&&a.date!=='TBD'?new Date(a.date):new Date('9999-12-31');
        var db=b.date&&b.date!=='TBD'?new Date(b.date):new Date('9999-12-31');
        return da-db;
      });
    }
    function safeTitle(t){ return (t||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

    var RESELL_RETAILERS = ['stockx','goat','klekt','limited resell'];
    var NIKE_RETAILERS = ['nike','nike snkrs'];
    function isRetailerBSTN(n){ return n.toLowerCase()==='bstn'; }
    function isRetailerResell(n){ return RESELL_RETAILERS.indexOf(n.toLowerCase())!==-1; }
    function isRetailerNike(n){ return NIKE_RETAILERS.indexOf(n.toLowerCase())!==-1; }
    function makeRetailersRow(r, isBig) {
      var rets = r.retailers;
      if (!rets || !rets.length) return makeBtn(r, isBig);
      var official = rets.filter(function(rt){ return !isRetailerResell(rt.name); });
      var html = '';
      if (official.length) {
        html += '<div class="retailers-label">Acheter</div><div class="retailers-row">';
        official.forEach(function(rt) {
          var cls = isRetailerBSTN(rt.name) ? 'btn-retailer btn-retailer--bstn'
                  : isRetailerNike(rt.name) ? 'btn-retailer btn-retailer--nike'
                  : 'btn-retailer btn-retailer--official';
          var icon = isRetailerBSTN(rt.name) ? '🛒 ' : isRetailerNike(rt.name) ? '✓ ' : '';
          var priceStr = rt.price ? ' <span style="opacity:.6;font-size:.65rem">' + rt.price + '</span>' : '';
          html += '<a href="' + rt.url + '" target="_blank" rel="noopener" class="' + cls + '" onclick="trackBSTN(\'' + safeTitle(rt.name+' - '+(r.title||'')) + '\')">' + icon + escapeHtml(rt.name) + priceStr + '</a>';
        });
        html += '</div>';
      }
      return html || makeBtn(r, isBig);
    }
    function makeBtn(r, isBig) {
      var released=isReleased(r.date);
      var hasAff=r.buy_url&&r.buy_url.indexOf('awin')!==-1;
      if (r.stock==='rupture') {
        var clsR=isBig?'btn-cop-big btn-cop-big--sold':'btn-cop btn-cop--sold';
        return '<span class="'+clsR+'">Rupture de stock</span>';
      }
      if (r.buy_url&&(released||hasAff)) {
        var label=released?'🔥 Acheter Avant Rupture':'🛒 Acheter sur BSTN';
        var cls=isBig?'btn-cop-big':'btn-cop';
        return '<a href="'+r.buy_url+'" target="_blank" rel="noopener" class="'+cls+'" onclick="trackBSTN(\''+safeTitle(r.title)+'\')">'+label+'</a>';
      } else {
        var wtcLink = r.wtc_url || ('https://www.whentocop.fr/search?q=' + encodeURIComponent(r.title || ''));
        var cls2=isBig?'btn-cop-big btn-cop-big--alert':'btn-cop btn-cop--alert';
        return '<a href="'+wtcLink+'" target="_blank" rel="noopener" class="'+cls2+'">Voir sur WhenToCop</a>';
      }
    }

    var FLIP_IDS = [];
    var NO_FLIP_IDS = ['air-jordan-3-brazil-releases-may-2026','air-jordan-3-brazil'];
    function renderCard(r, index) {
      var released=isReleased(r.date);
      var skuMatch=(r.id||'').match(/([a-z]{1,3}[0-9]{4,6}-[0-9]{3,4})(?:[^-]|$)/i);
      var cardSku=skuMatch?skuMatch[1]:'';
      var noFlip = NO_FLIP_IDS.indexOf(r.id||'') !== -1;
      var imgStyle = noFlip ? ' style="transform:scaleX(1)"' : '';
      // Pas d'image utilisable → card non rendue (le filtre en amont devrait l'éviter).
      if (!r.image_url || !String(r.image_url).trim()) return '';
      var img='<img src="'+r.image_url+'" alt="'+r.title+'" class="drop-card__img" loading="lazy"'+imgStyle+' onerror="window.sdfHideBrokenCard&&window.sdfHideBrokenCard(this)">';
      var badgeTop=released
        ?'<div class="drop-card__badge-top badge-week">🔥 Dispo</div>'
        :(isSoon(r.date)
          ?'<div class="drop-card__badge-top badge-hot">⏰ Cette semaine</div>'
          :'<div class="drop-card__badge-top badge-upcoming">📅 À venir</div>');
      var urgency=released?'⚠️ Stock limité':(!r.date||r.date==='TBD'?'DROP À VENIR':'');
      var urgencyClass=released?'drop-card__stock':'drop-card__stock drop-card__stock--upcoming';
      var articleUrl=r.id?'sorties/'+r.id+'.html':null;
      var imgWrap=articleUrl
        ?'<a href="'+articleUrl+'" class="drop-card__img-wrap" style="display:block">'+badgeTop+img+'</a>'
        :'<div class="drop-card__img-wrap">'+badgeTop+img+'</div>';
      var titleWrap=articleUrl
        ?'<a href="'+articleUrl+'" style="color:inherit"><h3 class="drop-card__title">'+escapeHtml(r.title)+'</h3></a>'
        :'<h3 class="drop-card__title">'+r.title+'</h3>';
      return '<article class="drop-card"'+(cardSku?' data-sku="'+cardSku+'"':'')+' data-title="'+safeTitle(r.title)+'">'+imgWrap+
        '<div class="drop-card__body">'+
          '<span class="drop-card__brand">'+(r.brand||'')+'</span>'+
          titleWrap+
          '<div class="drop-card__meta">'+
            '<span class="drop-card__date">📅 '+formatDate(r.date)+'</span>'+
            '<span class="drop-card__price">'+formatPrice(r.price)+'</span>'+
          '</div>'+

          (urgency?'<div class="'+urgencyClass+'">'+urgency+'</div>':'')+
          '<div class="drop-card__cta">'+makeRetailersRow(r,false)+'</div>'+
        '</div>'+
      '</article>';
    }

    function render() {
      // Page "Prochaines sorties" = uniquement les sorties strictement futures.
      // Les paires datées d'aujourd'hui (ex. sam. 16 mai → AJ3 Brazil, AJ1 Low Banned)
      // sont déjà sorties et n'ont pas leur place ici. Elles restent visibles sur
      // la home (Drops de la semaine) et via "Voir les anciennes sorties".
      // - upcoming   : date strictement future ou TBD     → bloc "📅 Prochaines sorties"
      // - aujourd'hui & passés : exclus (consultables ailleurs)
      var todayMidnight=new Date(); todayMidnight.setHours(0,0,0,0);
      var tomorrowMidnight=new Date(todayMidnight); tomorrowMidnight.setDate(tomorrowMidnight.getDate()+1);
      // Prochaines sorties = à partir du lundi prochain (semaine ISO suivante)
      // Les paires de la semaine courante (lundi-dimanche) sont dans "Drops de la semaine" sur la home
      var _day=todayMidnight.getDay();
      var _daysFromMon=_day===0?6:_day-1;
      var _monday=new Date(todayMidnight); _monday.setDate(todayMidnight.getDate()-_daysFromMon);
      var nextMondayMidnight=new Date(_monday); nextMondayMidnight.setDate(_monday.getDate()+7);

      function parseLocal(str){
        if (!str||str==='TBD') return null;
        var p=str.split('-');
        return p.length===3?new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])):null;
      }
      // Exclure les cards sans image utilisable des listings : évite l'emoji 👟
      // violet sur les sections publiques. La paire reste accessible via sa page détail.
      function hasUsableImage(r){ return r.image_url && String(r.image_url).trim() !== ''; }
      function brandFilter(r){ return !r.raffle && matchBrand(r,activeFilter) && hasUsableImage(r); }

      var upcoming=allReleases.filter(function(r){
        if (!r.date||r.date==='TBD') return false;
        var d=parseLocal(r.date);
        if (!d) return false;
        return d>=todayMidnight && brandFilter(r);
      });

      var sortedUpcoming=sortByDate(upcoming).slice(0,MAX_CARDS);

      var todayHeader=document.getElementById('today-header');
      var upcomingHeader=document.getElementById('upcoming-header');
      var weekHeader=document.getElementById('this-week-header');
      if (weekHeader) weekHeader.style.display='none';
      if (grid) grid.style.display='none';

      // Bloc "Disponible aujourd'hui" volontairement vide sur la page Prochaines sorties.
      if (todayHeader) todayHeader.style.display='none';
      if (gridToday) { gridToday.style.display='none'; gridToday.innerHTML=''; }

      if (sortedUpcoming.length) {
        if (upcomingHeader) upcomingHeader.style.display='block';
        if (gridUpcoming) {
          gridUpcoming.style.display='grid';
          gridUpcoming.innerHTML=sortedUpcoming.map(function(r,i){ return renderCard(r,i); }).join('');
        }
      } else {
        if (upcomingHeader) upcomingHeader.style.display='none';
        if (gridUpcoming) { gridUpcoming.style.display='none'; gridUpcoming.innerHTML=''; }
      }

      if (!sortedUpcoming.length) {
        if (empty) empty.style.display='block';
      } else {
        if (empty) empty.style.display='none';
      }
    }

    window._render=render;
    document.querySelectorAll('.filter-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); });
        btn.classList.add('active');
        activeFilter=btn.dataset.brand;
        render();
      });
    });

    fetch(RELEASES_URL)
      .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(data){
        if (loading) loading.style.display='none';
        allReleases=data.filter(function(r){ return r.id&&!r.id.startsWith('test-'); });
        window._releases=allReleases;

        if (!allReleases.length) { if (empty) empty.style.display='block'; return; }
        render();
      })
      .catch(function(err){
        if (loading) loading.style.display='none';
        if (empty) empty.style.display='block';
      });
  })();
  </script>

  <!-- BSTN live check -->
  <script>
  var BSTN_AWIN_MID='104979';
  var BSTN_AWIN_AFF='2855487';
  var BSTN_API_URL='https://searcht.bstn.com/collections/magento2_eu_products/documents/search';
  var BSTN_API_KEY='NCZstZEMLnMy4MSLPh9NKNrtMLsEF1Zy';
  var BSTN_SITE='https://www.bstn.com/';
  var _bstnCache={};
  function bstnAwinUrl(productPath){ return 'https://www.awin1.com/cread.php?awinmid='+BSTN_AWIN_MID+'&awinaffid='+BSTN_AWIN_AFF+'&p='+encodeURIComponent(BSTN_SITE+productPath); }
  function bstnCheckSku(sku,cb){
    if (!sku) return;
    var skuKey=sku.toLowerCase();
    if (_bstnCache[skuKey]!==undefined){ if (_bstnCache[skuKey]) cb(_bstnCache[skuKey]); return; }
    var skuNorm=skuKey.replace(/-/g,'');
    var q=skuKey.replace(/-/g,' ');
    var url=BSTN_API_URL+'?q='+encodeURIComponent(q)+'&query_by=name&per_page=5&filter_by=price%3A%3E0';
    fetch(url,{headers:{'X-TYPESENSE-API-KEY':BSTN_API_KEY}})
      .then(function(r){ return r.json(); })
      .then(function(data){
        var hits=data.hits||[];
        for (var i=0;i<hits.length;i++){
          var doc=hits[i].document;
          var docUrl=(doc.url||'').toLowerCase();
          if (docUrl.indexOf(skuNorm)!==-1){ var awinUrl=bstnAwinUrl(doc.url); _bstnCache[skuKey]=awinUrl; cb(awinUrl); return; }
        }
        _bstnCache[skuKey]=null;
      }).catch(function(){ _bstnCache[skuKey]=null; });
  }
  function bstnInjectBtn(container,awinUrl,label){
    if (!container||container.querySelector('.btn-bstn-aff')) return;
    var btn=document.createElement('a');
    btn.href=awinUrl; btn.target='_blank'; btn.rel='noopener sponsored';
    btn.className='btn-bstn-aff'; btn.textContent=label||'Acheter sur BSTN';
    btn.onclick=function(){ trackBSTN(container.closest('[data-title]')?container.closest('[data-title]').getAttribute('data-title'):'bstn'); };
    container.appendChild(btn);
  }
  (function(){
    var observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if (node.nodeType!==1) return;
          var cards=node.matches&&node.matches('.drop-card')?[node]:Array.from(node.querySelectorAll('.drop-card[data-sku]'));
          cards.forEach(function(card){
            var sku=card.getAttribute('data-sku');
            if (!sku) return;
            var ctaDiv=card.querySelector('.drop-card__cta');
            bstnCheckSku(sku,function(url){ bstnInjectBtn(ctaDiv,url,'Acheter sur BSTN'); });
          });
        });
      });
    });
    var grids=['releases-grid-week','releases-grid-today','releases-grid-upcoming'];
    grids.forEach(function(id){ var el=document.getElementById(id); if (el) observer.observe(el,{childList:true,subtree:true}); });
  })();
  </script>

  <!-- Past releases -->
  <script>
  function renderPastGrid(data){
    var pastGrid=document.getElementById('past-grid');
    var btn=document.getElementById('btn-past');
    if (!data.length){
      pastGrid.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Aucune ancienne sortie disponible.</p>';
    } else {
      // Filtrer les past sans image utilisable — pas de fallback emoji violet 👟 dans la grille.
      data = data.filter(function(r) { return r.image_url && String(r.image_url).trim() !== ''; });
      if (!data.length) {
        pastGrid.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Aucune ancienne sortie disponible.</p>';
        pastGrid.style.display='block';
        btn.textContent='🔼 Masquer les anciennes sorties';
        return;
      }
      var html='<div class="cards-grid">';
      data.forEach(function(r){
        var img='<img src="'+r.image_url+'" class="drop-card__img" loading="lazy" onerror="window.sdfHideBrokenCard&&window.sdfHideBrokenCard(this)">';
        var hasLink=(r.retailers&&r.retailers.length)||r.buy_url||r.wtc_url;
        var articleUrl=(r.id&&hasLink)?'sorties/'+r.id+'.html':null;
        var imgWrap=articleUrl
          ?'<a href="'+articleUrl+'" class="drop-card__img-wrap" style="display:block">'+img+'</a>'
          :'<div class="drop-card__img-wrap">'+img+'</div>';
        var titleWrap=articleUrl
          ?'<a href="'+articleUrl+'" style="color:inherit"><h3 class="drop-card__title">'+escapeHtml(r.title)+'</h3></a>'
          :'<h3 class="drop-card__title">'+escapeHtml(r.title)+'</h3>';
        var ctaHref=r.link||articleUrl||'#';
        var ctaTarget=(articleUrl&&!r.link)?'':' target="_blank" rel="noopener"';
        html+='<article class="drop-card">'+imgWrap+'<div class="drop-card__body"><div class="drop-card__brand">'+(r.brand||r.source||'')+'</div>'+titleWrap+'<div class="drop-card__meta"><span>'+(r.date||'TBD')+'</span><span class="drop-card__price">'+(r.price||'')+'</span></div><a href="'+ctaHref+'"'+ctaTarget+' class="drop-card__cta btn-cop">Voir la paire</a></div></article>';
      });
      html+='</div>';
      pastGrid.innerHTML=html;
    }
    pastGrid.style.display='block';
    btn.textContent='🔼 Masquer les anciennes sorties';
  }
  function loadPastReleases(){
    var btn=document.getElementById('btn-past');
    var pastGrid=document.getElementById('past-grid');
    if (pastGrid.style.display==='block'){ pastGrid.style.display='none'; btn.textContent='🕐 Voir les anciennes sorties'; return; }
    btn.textContent='Chargement...';
    fetch('https://raw.githubusercontent.com/sneakerdropfr/sneakerdropfr.github.io/main/releases_past.json?t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(data){ renderPastGrid(data); })
      .catch(function(){ renderPastGrid([]); btn.textContent='🕐 Voir les anciennes sorties'; });
  }
  </script>
