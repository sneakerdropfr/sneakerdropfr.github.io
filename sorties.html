<!DOCTYPE html>
<html lang="fr">
<head>
  <script>
  (function(){var s=localStorage.getItem('theme-pref');if(s==='dark'||(s===null&&window.matchMedia('(prefers-color-scheme: dark)').matches)){document.documentElement.setAttribute('data-theme','dark');}})();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prochaines Sorties Sneakers — SneakerDrop FR</title>
  <meta name="description" content="Toutes les prochaines sorties sneakers en France : Nike, Air Jordan, Adidas, New Balance. Dates, prix retail, filtres par marque." />
  <link rel="canonical" href="https://sneakerdropfr.fr/sorties.html" />
  <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
  <link rel="stylesheet" href="/assets/css/shared.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet" />
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1TQQ3RSJJV"></script>
  <script src="/assets/js/common.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#FF2D2D;
      --pink:#FF2D2D;
      --black:#0A0A0A;
      --white:#FFFFFF;
      --bg:#FFFFFF;
      --bg-alt:#F5F5F5;
      --text:#0A0A0A;
      --muted:#777;
      --border:#E5E5E5;
      --shadow:0 2px 12px rgba(0,0,0,0.07);
      --shadow-hover:0 8px 28px rgba(0,0,0,0.11);
      --r:12px;
      --font-display:'Bebas Neue',sans-serif;
      --font-body:'Barlow',sans-serif;
      --font-cond:'Barlow Condensed',sans-serif;
      --section-gap:4.5rem;
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:72px}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .container{max-width:1100px;margin:0 auto;padding:0 1.5rem}

    /* Header */
    .header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .header__inner{display:flex;align-items:center;gap:.75rem;height:56px}
    .logo{display:flex;align-items:center;gap:.45rem;font-family:var(--font-cond);font-size:1.15rem;font-weight:900;letter-spacing:.04em;color:var(--black);flex-shrink:0}
    .logo__icon{width:30px;height:30px;background:transparent;border-radius:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .logo__fr{opacity:.45}
    .header__spacer{flex:1}
    .header__nav{display:flex;align-items:center;gap:.5rem}
    .hbtn{font-family:var(--font-cond);font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;padding:.42rem .9rem;border-radius:6px;white-space:nowrap;transition:background .15s,color .15s,border-color .15s;cursor:pointer;display:inline-flex;align-items:center;gap:.3rem}
    .hbtn--solid{background:var(--black);color:#fff;border:1px solid var(--black)}
    .hbtn--solid:hover{background:var(--accent);color:var(--black);border-color:var(--accent)}
    .hbtn--back{background:transparent;color:var(--black);border:1px solid var(--border)}
    .hbtn--back:hover{border-color:var(--black);background:var(--black);color:#fff}

    /* Section */
    .section{padding:var(--section-gap) 0}
    .section-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2rem;gap:1rem;flex-wrap:wrap}
    .section-title{font-family:var(--font-display);font-size:clamp(1.9rem,5vw,2.8rem);letter-spacing:.03em;text-transform:uppercase;line-height:1}
    .section-badge{font-family:var(--font-cond);font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .7rem;border-radius:999px;background:#0A0A0A;color:#fff}

    /* Filters */
    .filters{display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:1.75rem}
    .filter-btn{padding:.38rem .95rem;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:var(--font-cond);font-size:.82rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:all .15s}
    .filter-btn:hover{border-color:var(--black);color:var(--black)}
    .filter-btn.active{background:var(--black);border-color:var(--black);color:#fff}

    /* Sub-headers */
    .sub-header{display:flex;align-items:center;gap:.7rem;margin:1.75rem 0 .9rem}
    .sub-header__line{flex:1;height:1px;background:var(--border)}
    .sub-header__label{font-family:var(--font-cond);font-size:.72rem;font-weight:900;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);white-space:nowrap}

    /* Cards grid */
    .cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.1rem}
    @media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.cards-grid{grid-template-columns:repeat(2,1fr);gap:.65rem}}
    .releases-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.1rem}
    @media(max-width:900px){.releases-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:480px){.releases-grid{grid-template-columns:repeat(2,1fr);gap:.6rem}}
    #releases-grid-week{display:none}

    /* Drop card */
    .drop-card{background:#0A0A0A;border:1px solid rgba(255,255,255,.08);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:border-color .2s,transform .2s,box-shadow .2s}
    .drop-card:hover{border-color:rgba(255,255,255,.3);transform:translateY(-4px);box-shadow:var(--shadow-hover)}
    .drop-card__img-wrap{position:relative;aspect-ratio:1;background:#fff;overflow:hidden;flex-shrink:0}
    .drop-card__img{width:100%;height:100%;object-fit:contain;padding:.9rem;transition:transform .3s;transform:scaleX(-1)}
    .drop-card:hover .drop-card__img{transform:scaleX(-1) scale(1.07)}
    .drop-card__img-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:2.5rem}
    .drop-card__badge-top{position:absolute;top:.65rem;left:.65rem;font-family:var(--font-cond);font-size:.65rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:.18rem .55rem;border-radius:4px;z-index:1}
    .badge-week{background:#E8FF00;color:#0A0A0A}
    .badge-hot{background:#FF2D2D;color:#fff}
    .badge-upcoming{background:rgba(255,255,255,.15);color:#fff}
    .drop-card__body{padding:.9rem;display:flex;flex-direction:column;gap:.28rem;flex:1}
    .drop-card__brand{font-family:var(--font-cond);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45)}
    .drop-card__title{font-family:var(--font-cond);font-size:.95rem;font-weight:900;line-height:1.2;text-transform:uppercase;letter-spacing:.03em;color:#fff}
    .drop-card__meta{display:flex;align-items:center;justify-content:space-between;margin-top:.15rem;gap:.4rem}
    .drop-card__date{font-size:.74rem;color:rgba(255,255,255,.5);font-family:var(--font-cond);font-weight:600}
    .drop-card__price{font-family:var(--font-cond);font-size:1.15rem;font-weight:900;color:#fff}
    .drop-card__resell{font-size:.68rem;font-weight:700;color:rgba(255,255,255,.5);margin-top:.1rem}
    .drop-card__resell::before{content:'↑ ';color:#fff;opacity:.4}
    .drop-card__stock{font-size:.68rem;color:#FF2D2D;font-family:var(--font-cond);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
    .drop-card__stock--upcoming{color:rgba(255,255,255,.5)}
    .drop-card__cta{margin-top:auto;padding-top:.65rem}
    .btn-cop{display:block;width:100%;background:var(--black);color:#fff;font-family:var(--font-cond);font-weight:900;font-size:.85rem;letter-spacing:.07em;text-transform:uppercase;padding:.62rem .9rem;border-radius:7px;border:none;cursor:pointer;text-align:center;transition:background .15s,color .15s}
    .btn-cop:hover{background:var(--accent);color:var(--black)}
    .btn-cop--alert{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
    .btn-cop--alert:hover{background:#fff;color:var(--black)}
    .btn-cop--sold,.btn-cop-big--sold{display:block;background:rgba(255,255,255,.08);color:rgba(255,255,255,.35);font-size:.78rem;font-weight:900;text-transform:uppercase;letter-spacing:.05em;padding:.55rem .9rem;border-radius:7px;cursor:default;border:1px solid var(--border);text-align:center;width:100%}
    .retailers-row{display:flex;flex-wrap:wrap;gap:.38rem;margin-top:.3rem}
    .retailers-label{font-family:var(--font-cond);font-size:.63rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:.2rem;margin-top:.45rem}
    .btn-retailer{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--font-cond);font-size:.72rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;padding:.35rem .65rem;border-radius:6px;border:none;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,transform .12s;text-decoration:none;line-height:1.2}
    .btn-retailer:hover{transform:translateY(-1px)}
    .btn-retailer--bstn{background:#0A0A0A;color:#fff;border:1px solid rgba(255,255,255,.15)}
    .btn-retailer--bstn:hover{background:#E8FF00;color:#0A0A0A;border-color:#E8FF00}
    .btn-retailer--nike{background:#111;color:#fff;border:1px solid rgba(255,255,255,.1)}
    .btn-retailer--nike:hover{background:#E8FF00;color:#0A0A0A}
    .btn-retailer--official{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18)}
    .btn-retailer--official:hover{background:rgba(255,255,255,.2)}
    .btn-bstn-aff{display:inline-block;background:var(--black);color:#fff;font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;padding:.38rem .85rem;border-radius:6px;text-decoration:none;margin-top:.45rem;transition:background .15s,color .15s}
    .btn-bstn-aff:hover{background:var(--accent);color:var(--black)}
    .releases-loading,.releases-empty{text-align:center;padding:3rem 1rem;color:var(--muted);font-family:var(--font-cond);font-size:.95rem}

    /* Past btn */
    #btn-past{background:var(--black);border:2px solid var(--black);color:#fff;padding:.75rem 2rem;border-radius:999px;font-family:var(--font-cond);font-weight:900;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%;max-width:360px;display:block;margin:1.5rem auto 0;transition:background .15s,color .15s,border-color .15s}
    #btn-past:hover{background:var(--accent);border-color:var(--accent);color:var(--black)}

    /* Raffle compact */
    #raffle-section{background:var(--bg);padding:0 0 2rem}
    .raffle-single{display:flex;background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);max-width:520px}
    .raffle-single__img{width:140px;flex-shrink:0;background:#F9F9F9}
    .raffle-single__img img{width:100%;height:100%;object-fit:cover;display:block}
    .raffle-single__body{padding:1.1rem 1.3rem;display:flex;flex-direction:column;justify-content:space-between;gap:.65rem;flex:1}
    .raffle-single__badge{display:inline-block;background:#0A0A0A;color:#fff;font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:.22rem .6rem;border-radius:999px;align-self:flex-start}
    .raffle-single__title{font-family:var(--font-cond);font-size:1rem;font-weight:900;color:var(--black);line-height:1.2}
    .raffle-single__meta{font-size:.78rem;color:var(--muted)}
    .raffle-single__btn{display:inline-block;background:var(--black);color:#fff;font-family:var(--font-cond);font-size:.78rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;padding:.5rem 1.1rem;border-radius:999px;text-decoration:none;align-self:flex-start;transition:background .15s,color .15s}
    .raffle-single__btn:hover{background:var(--accent);color:var(--black)}
    .raffle-more{font-family:var(--font-cond);font-size:.78rem;font-weight:700;color:var(--muted);margin-top:.5rem;letter-spacing:.04em}
    #raffle-grid{display:none}
    @media(max-width:500px){.raffle-single{flex-direction:column}.raffle-single__img{width:100%;height:160px}}

    /* Footer */
    .footer{padding:2rem 0;border-top:1px solid var(--border)}
    .footer__inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
    .footer__legal{font-size:.72rem;color:#bbb;width:100%;text-align:center;padding-top:.7rem;border-top:1px solid var(--border);margin-top:.7rem}
    .footer__social{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}
    .social-btn{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--font-cond);font-size:.82rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:.45rem 1rem;border-radius:6px;border:1px solid var(--border);color:var(--black);transition:all .15s}
    .social-btn:hover{background:var(--black);color:#fff;border-color:var(--black)}
    .social-btn--tg:hover{background:#229ED9;border-color:#229ED9}

    /* Scroll top */
    .scroll-top{position:fixed;bottom:84px;left:16px;background:rgba(255,255,255,.92);border:1px solid var(--border);color:var(--black);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;cursor:pointer;z-index:999;opacity:0;transition:opacity .3s,transform .15s;box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .scroll-top.visible{opacity:1}
    .scroll-top:hover{transform:translateY(-3px);border-color:var(--black)}

    @media(max-width:768px){:root{--section-gap:3rem}}
    @media(max-width:480px){.drop-card__body{padding:.75rem}.drop-card__title{font-size:.85rem}}
      .hbtn--outline:hover{background:#F0F0F0;color:#111}
      .filter-btn.active{background:#F0F0F0;color:#111}

    /* ══ DARK MODE ══ */
    :root[data-theme="dark"]{
      --bg:#0F0F0F;
      --bg-alt:#1A1A1A;
      --text:#F0F0F0;
      --muted:#999;
      --border:#2C2C2C;
      --black:#F0F0F0;
      --white:#0F0F0F;
    }
    html[data-theme="dark"] body{background:#0F0F0F;color:#F0F0F0}
    html[data-theme="dark"] .header,html[data-theme="dark"] header{background:rgba(15,15,15,.97)!important;border-bottom-color:#2C2C2C!important}
    html[data-theme="dark"] .header__nav-bar{background:rgba(15,15,15,.97)!important;border-bottom-color:#2C2C2C!important}
    html[data-theme="dark"] nav{background:rgba(15,15,15,.97)!important;border-color:#2C2C2C!important}
    html[data-theme="dark"] .hero{background:#0F0F0F!important;color:#F0F0F0!important}
    html[data-theme="dark"] .hero__sub{color:rgba(255,255,255,.45)!important}
    html[data-theme="dark"] .hero__benefits span{color:rgba(255,255,255,.5)!important}
    html[data-theme="dark"] .hero__benefits{color:rgba(255,255,255,.5)!important}
    html[data-theme="dark"] .hero__brands{color:rgba(255,255,255,.3)!important}
    html[data-theme="dark"] .hero__eyebrow{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .hero-search{background:#1A1A1A!important;border-bottom-color:#2C2C2C!important}
    html[data-theme="dark"] .hero-search__input{background:#111!important;color:#F0F0F0!important;border-color:#2C2C2C!important}
    html[data-theme="dark"] .hero-search__input::placeholder{color:#555!important}
    html[data-theme="dark"] .hero__ctas .hbtn--solid{background:#F0F0F0!important;color:#0F0F0F!important;border-color:#F0F0F0!important}
    html[data-theme="dark"] .hbtn--solid{background:#F0F0F0!important;color:#0F0F0F!important;border-color:#F0F0F0!important}
    html[data-theme="dark"] .hbtn--solid:hover{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important}
    html[data-theme="dark"] .hbtn--outline{color:#F0F0F0!important;border-color:#2C2C2C!important}
    html[data-theme="dark"] .hbtn--outline:hover{border-color:#F0F0F0!important;background:#F0F0F0!important;color:#0F0F0F!important}
    html[data-theme="dark"] .drop-card{background:#1A1A1A!important;border-color:#2C2C2C!important}
    html[data-theme="dark"] .drop-card:hover{border-color:#444!important}
    html[data-theme="dark"] .drop-card__body{background:#1A1A1A!important;color:#F0F0F0!important}
    html[data-theme="dark"] .drop-card__img-wrap{background:#111!important}
    html[data-theme="dark"] .drop-card__title,.drop-card__brand,.drop-card__price,.drop-card__meta,.drop-card__sku,.drop-card__diff{color:inherit}
    html[data-theme="dark"] .drop-card__title{color:#F0F0F0!important}
    html[data-theme="dark"] .drop-card__brand{color:rgba(255,255,255,.45)!important}
    html[data-theme="dark"] .drop-card__price{color:#F0F0F0!important}
    html[data-theme="dark"] .drop-card__meta{color:rgba(255,255,255,.5)!important}
    html[data-theme="dark"] .drop-card__sku{color:rgba(255,255,255,.35)!important}
    html[data-theme="dark"] .filter-btn{background:#1A1A1A!important;color:#999!important;border-color:#2C2C2C!important}
    html[data-theme="dark"] .filter-btn.active{background:#F0F0F0!important;color:#0F0F0F!important}
    html[data-theme="dark"] .filter-btn:hover{background:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .week-tab{color:rgba(255,255,255,.5)!important;border-color:#2C2C2C!important;background:#0F0F0F!important}
    html[data-theme="dark"] .week-tab.active{background:#F0F0F0!important;color:#0F0F0F!important;border-color:#F0F0F0!important}
    html[data-theme="dark"] .section--alt{background:#141414!important}
    html[data-theme="dark"] .cards-section{background:#0F0F0F!important}
    html[data-theme="dark"] .ticker{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .top-pick__card,html[data-theme="dark"] .top-pick__img-wrap{background:#1A1A1A!important}
    html[data-theme="dark"] .top-pick__title{color:#F0F0F0!important}
    html[data-theme="dark"] .top-pick__brand{color:rgba(255,255,255,.45)!important}
    html[data-theme="dark"] .top-pick__price{color:#F0F0F0!important}
    html[data-theme="dark"] .src{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .blog-card,html[data-theme="dark"] .article-card{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .blog-card__title,html[data-theme="dark"] .article-card__title{color:#F0F0F0!important}
    html[data-theme="dark"] .blog-card__excerpt,html[data-theme="dark"] .article-card__excerpt{color:rgba(255,255,255,.55)!important}
    html[data-theme="dark"] footer,html[data-theme="dark"] .footer{background:#0A0A0A!important;border-top-color:#2C2C2C!important;color:#888!important}
    html[data-theme="dark"] footer a{color:#888!important}
    html[data-theme="dark"] #cookie-banner{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#999!important}
    html[data-theme="dark"] #cookie-accept{background:#F0F0F0!important;color:#0F0F0F!important}
    html[data-theme="dark"] #cookie-refuse{border-color:#2C2C2C!important;color:#999!important}
    html[data-theme="dark"] #scroll-top{background:#F0F0F0!important;color:#0F0F0F!important}
    /* Raffle cards */
    html[data-theme="dark"] .raffle-card,html[data-theme="dark"] .raffle-single{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .raffle-card__title{color:#F0F0F0!important}
    html[data-theme="dark"] .raffle-card__brand{color:rgba(255,255,255,.45)!important}
    html[data-theme="dark"] .raffle-card__date{color:rgba(255,255,255,.55)!important}
    html[data-theme="dark"] .raffle-info-box{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .raffle-info-box strong{color:var(--accent)!important}
    /* Sorties */
    html[data-theme="dark"] .releases-grid{background:#0F0F0F!important}
    html[data-theme="dark"] .release-card,html[data-theme="dark"] .sort-card{background:#1A1A1A!important;border-color:#2C2C2C!important;color:#F0F0F0!important}
    html[data-theme="dark"] .release-card__title{color:#F0F0F0!important}
    html[data-theme="dark"] .release-card__brand{color:rgba(255,255,255,.45)!important}
    html[data-theme="dark"] .back-link{color:#F0F0F0!important;border-color:#2C2C2C!important;background:#1A1A1A!important}
    html[data-theme="dark"] .back-link:hover{background:#2C2C2C!important}
    html[data-theme="dark"] p{color:rgba(255,255,255,.7)}
    html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] h3{color:#F0F0F0}
    /* Theme toggle */

      return '<article class="drop-card"' + (cardSku ? ' data-sku="' + cardSku + '"' : '') + ' data-title="' + safeTitle(r.title) + '">' + imgWrap +
        '<div class="drop-card__body">' +
          '<span class="drop-card__brand">' + (r.brand || '') + '</span>' +
          titleWrap +
          hypeScoreHtml +
          difficultyHtml +
          '<div class="drop-card__meta">' +
            '<span class="drop-card__date">📅 ' + formatDate(r.date) + '</span>' +
            '<span class="drop-card__price">' + formatPrice(r.price) + '</span>' +
          '</div>' +
          countdownHtml +
          (urgency ? '<div class="' + urgencyClass + '">' + urgency + '</div>' : '') +
          '<div class="drop-card__cta">' + makeRetailersRow(r, false) + '</div>' +
        '</div>' +
      '</article>';
    }

    function render() {
      var _now = new Date();
      var _day = _now.getDay();
      var _daysFromMon = _day === 0 ? 6 : _day - 1;
      var _monday = new Date(_now); _monday.setDate(_now.getDate() - _daysFromMon); _monday.setHours(0,0,0,0);
      var _sunday = new Date(_monday); _sunday.setDate(_monday.getDate() + 6); _sunday.setHours(23,59,59,999);
      // Semaine suivante (bascule lundi 00:00 local)
      var _nextMonday = new Date(_monday); _nextMonday.setDate(_monday.getDate() + 7);
      var _nextSunday = new Date(_nextMonday); _nextSunday.setDate(_nextMonday.getDate() + 6); _nextSunday.setHours(23,59,59,999);
      if (weeklyDropsBadge) {
        weeklyDropsBadge.textContent = _monday.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) + ' \u2192 ' + _sunday.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
      }
      function parseDateLocal(str) {
        var p = str.split('-');
        return p.length === 3 ? new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])) : null;
      }
      var notReleased = allReleases.filter(function(r) {
        if (!r.date || r.date === 'TBD') return true;
        var d = parseDateLocal(r.date);
        if (!d) return true;
        var todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
        return d >= todayMidnight;
      });
      var filtered = notReleased.filter(function(r) { return matchBrand(r, activeFilter); });
      if (window._searchQuery) {
        // Recherche dans tout le catalogue (à venir + passés)
        var allFiltered = (window.allReleases || []).filter(function(r) {
          return ((r.title||'').toLowerCase().indexOf(window._searchQuery) !== -1
              || (r.brand||'').toLowerCase().indexOf(window._searchQuery) !== -1)
              && matchBrand(r, activeFilter);
        });
        filtered = allFiltered;
      }
      var sorted = sortByDate(filtered).slice(0, MAX_CARDS);
      if (!sorted.length) {
        if (grid) grid.style.display = 'none';
        if (gridUpcoming) gridUpcoming.style.display = 'none';
        document.getElementById('this-week-header').style.display = 'none';
        document.getElementById('upcoming-header').style.display = 'none';
        if (weeklyDropsGrid) { weeklyDropsGrid.style.display = 'none'; weeklyDropsGrid.innerHTML = ''; }
        if (weeklyDropsEmpty) weeklyDropsEmpty.style.display = 'block';
        if (empty) empty.style.display = window._searchQuery ? 'none' : 'block';
        return;
      }
      if (empty) empty.style.display = 'none';
      // thisWeek : toutes les paires semaine ISO en cours (lundi-dimanche inclus jours passes)
      var thisWeek = allReleases.filter(function(r) {
        if (!r.date || r.date === 'TBD') return false;
        var d = parseDateLocal(r.date);
        return d && d >= _monday && d <= _sunday;
      });
      var laterOn = sorted.filter(function(r) {
        if (!r.date || r.date === 'TBD') return true;
        var d = parseDateLocal(r.date);
        return !d || d > _sunday;
      });
      // Weekly drops section — chargé depuis weekly_data.json
      (function loadWeeklyData() {
        var WEEKLY_BRAND_MAP = {'jordan':['jordan brand','jordan'],'nike':['nike'],'adidas':['adidas'],'new balance':['new balance']};
        var weeklyActiveFilter = 'all';
        var allWdrops = [];

        function matchWeeklyBrand(r, filter) {
          if (filter === 'all') return true;
          var b = (r.brand || '').toLowerCase();
          var keys = WEEKLY_BRAND_MAP[filter.toLowerCase()] || [filter.toLowerCase()];
          return keys.some(function(k) { return b.indexOf(k) !== -1; });
        }

        function renderWeeklyDrops() {
          if (!weeklyDropsGrid) return;
          var filtered = sortByDate(allWdrops.filter(function(r) { return matchWeeklyBrand(r, weeklyActiveFilter); }));
          if (filtered.length) {
            weeklyDropsGrid.style.display = 'grid';
            weeklyDropsGrid.innerHTML = filtered.map(function(r, i) { return renderCard(r, i); }).join('');
            if (weeklyDropsEmpty) weeklyDropsEmpty.style.display = 'none';
          } else {
            weeklyDropsGrid.style.display = 'none';
            if (weeklyDropsEmpty) weeklyDropsEmpty.style.display = 'block';
          }
        }

        // Filtres marque drops de la semaine
        document.querySelectorAll('#weekly-filters .filter-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            document.querySelectorAll('#weekly-filters .filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            weeklyActiveFilter = btn.getAttribute('data-weekly');
            renderWeeklyDrops();
          });
        });

        // Avant lundi 00:00 local : afficher la semaine en cours depuis releases.json
        // MAIS si thisWeek est vide (fin de semaine), charger weekly_data.json quand même
        if (_now < _nextMonday && thisWeek.length > 0) {
          allWdrops = thisWeek;
          renderWeeklyDrops();
          return;
        }
        fetch('https://cdn.jsdelivr.net/gh/sneakerdropfr/sneakerdropfr.github.io@main/weekly_data.json?t=' + Date.now())
          .then(function(res) { return res.json(); })
          .then(function(wd) {
            // Vérifier que weekly_data.json correspond bien à la semaine en cours ou future
            // Si week_end est dans le passé → fallback releases.json
            try {
              var we = (wd.week_end||'').split('/');
              if (we.length===3) {
                var weDate = new Date(+we[2],+we[1]-1,+we[0]);
                weDate.setHours(23,59,59,999);
                if (weDate < _now) {
                  // weekly_data.json périmé → fallback sur releases.json cette semaine
                  allWdrops = thisWeek;
                  renderWeeklyDrops();
                  return;
                }
              }
            } catch(e) {}
            // Index releases.json par titre normalisé pour enrichissement
            function normTitle(t) { return (t||'').toLowerCase().trim().replace(/[\u2018\u2019\u201c\u201d\u00ab\u00bb"]/g,"'"); }
            var relIdx = {};
            (allReleases || []).forEach(function(rel) {
              var key = normTitle(rel.title);
              if (key) relIdx[key] = rel;
            });

            allWdrops = (wd.releases || []).map(function(r) {
              var dparts = (r.date||'').split('/');
              var isoDate = dparts.length===3 ? (dparts[2]+'-'+dparts[1]+'-'+dparts[0]) : r.date;
              var wTitle = r.name || r.title || '';
              // Chercher la paire correspondante dans releases.json (par titre exact ou partiel)
              var rel = relIdx[normTitle(wTitle)];
              if (!rel) {
                // Fallback : chercher si le titre releases contient le titre weekly ou vice-versa
                var wNorm = normTitle(wTitle);
                Object.keys(relIdx).forEach(function(k) {
                  if (!rel && (k.indexOf(wNorm) !== -1 || wNorm.indexOf(k) !== -1)) {
                    rel = relIdx[k];
                  }
                });
              }
              return {
                title: wTitle,
                brand: r.brand || (rel && rel.brand) || '',
                date: isoDate,
                price: r.price || (rel && rel.price) || '',
                image_url: r.image || r.image_url || (rel && rel.image_url) || '',
                wtc_url: r.wtc_url || r.link || (rel && rel.wtc_url) || '',
                buy_url: r.buy_url || r.buy_link || (rel && rel.buy_url) || '',
                id: r.id || (rel && rel.id) || '',
                resell: r.resell || (rel && rel.resell) || '',
                stock: r.stock || (rel && rel.stock) || '',
                retailers: (rel && rel.retailers) || r.retailers || null
              };
            });
            // Badge : si on est lundi ou après, afficher la semaine de weekly_data.json
            if (weeklyDropsBadge && _now >= _nextMonday) {
              try {
                var ws = (wd.week_start||'').split('/');
                var we = (wd.week_end||'').split('/');
                var ds = ws.length===3 ? new Date(+ws[2],+ws[1]-1,+ws[0]) : null;
                var de = we.length===3 ? new Date(+we[2],+we[1]-1,+we[0]) : null;
                if (ds && de) weeklyDropsBadge.textContent = ds.toLocaleDateString('fr-FR',{day:'numeric',month:'short'}) + ' → ' + de.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
              } catch(e){}
            }
            renderWeeklyDrops();
          })
          .catch(function() {
            // Fallback releases.json
            allWdrops = thisWeek;
            renderWeeklyDrops();
          });
      })();
      document.getElementById('this-week-header').style.display = 'none';
      if (grid) grid.style.display = 'none';
      // Fusionner thisWeek + laterOn dans gridUpcoming (sans doublons)
      var seenIds = {};
      var allVisible = [];
      thisWeek.forEach(function(r) { if (!seenIds[r.id||r.title]) { seenIds[r.id||r.title]=1; allVisible.push(r); } });
      laterOn.forEach(function(r) { if (!seenIds[r.id||r.title]) { seenIds[r.id||r.title]=1; allVisible.push(r); } });
      var allVisibleSorted = sortByDate(allVisible);
      if (allVisibleSorted.length) {
        document.getElementById('upcoming-header').style.display = 'block';
        gridUpcoming.style.display = 'grid';
        gridUpcoming.innerHTML = allVisibleSorted.map(function(r, i) { return renderCard(r, i); }).join('');
      } else {
        document.getElementById('upcoming-header').style.display = 'none';
        if (gridUpcoming) gridUpcoming.style.display = 'none';
      }
    }

    // ── Countdown global tick ──────────────────────────────────────────────
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function tickCountdowns() {
      var now = Date.now();
      document.querySelectorAll('.drop-card__countdown[data-target]').forEach(function(el) {
        var target = parseInt(el.getAttribute('data-target'), 10);
        var diff = target - now;
        if (diff <= 0) {
          el.textContent = 'DISPO MAINTENANT';
          el.classList.add('drop-card__countdown--dispo');
        } else {
          var totalSec = Math.floor(diff / 1000);
          var days = Math.floor(totalSec / 86400);
          var hrs  = Math.floor((totalSec % 86400) / 3600);
          var mins = Math.floor((totalSec % 3600) / 60);
          var secs = totalSec % 60;
          var txt = (days > 0 ? days + 'J ' : '') + pad2(hrs) + ':' + pad2(mins) + ':' + pad2(secs);
          el.textContent = '⏱ ' + txt;
        }
      });
    }
    setInterval(tickCountdowns, 1000);
    tickCountdowns();

    window._render = render;
    document.querySelectorAll('.filter-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        activeFilter = btn.dataset.brand;
        render();
      });
    });

    function fetchWithTimeout(url, ms) {
      var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      var timer = ctrl ? setTimeout(function() { ctrl.abort(); }, ms) : null;
      return fetch(url, ctrl ? {signal: ctrl.signal} : {}).then(function(r) {
        if (timer) clearTimeout(timer); return r;
      }).catch(function(e) {
        if (timer) clearTimeout(timer); throw e;
      });
    }

    fetchWithTimeout(RELEASES_URL, 8000)
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .catch(function(e) {
        // Fallback raw.githubusercontent.com
        return fetch(RELEASES_URL_FALLBACK).then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
      })
      .then(function(data) {
        if (loading) loading.style.display = 'none';
        allReleases = data.filter(function(r) { return r.id && !r.id.startsWith('test-'); });
        window._releases = allReleases.slice();
        window.allReleases = allReleases;
        // Enrichir la recherche avec releases_past.json
        fetch('https://raw.githubusercontent.com/sneakerdropfr/sneakerdropfr.github.io/main/releases_past.json?t=' + Date.now())
          .then(function(res) { return res.json(); })
          .catch(function() { return []; })
          .then(function(past) {
            var seenIds = {};
            window._releases.forEach(function(r) { seenIds[r.id] = true; });
            past.forEach(function(r) { if (r.id && !seenIds[r.id]) window._releases.push(r); });
            window.allReleases = window._releases.slice();
          });

        // Section Raffles — compact: 1 card visible
        (function() {
          var raffles = allReleases.filter(function(r) { return r.raffle === true; }).sort(function(a,b){ var da=a.date||'9999'; var db=b.date||'9999'; return da<db?-1:da>db?1:(a.id||'').localeCompare(b.id||''); });
          var section = document.getElementById('raffle-section');
          var grid = document.getElementById('raffle-grid'); // kept for JS compat, hidden
          var compact = document.getElementById('raffle-compact');
          if (!section || !raffles.length) return;
          section.style.display = 'block';
          // Full grid (hidden, JS compat)
          if (grid) {
            grid.innerHTML = raffles.map(function(r) {
              var dateStr = '';
              if (r.date && r.date !== 'TBD') {
                var p = r.date.split('-');
                var d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
                dateStr = 'Drop le ' + d.toLocaleDateString('fr-FR', {day:'numeric', month:'long', year:'numeric'});
              }
              var price = r.price ? r.price + '' : '';
              return '<div class="raffle-card">'
                + '<div class="raffle-card__img"><img src="' + (r.image_url||'') + '" alt="' + (r.title||'').replace(/"/g,'') + '" loading="lazy"></div>'
                + '<div class="raffle-card__body">'
                + '<span class="raffle-card__badge">Raffle</span>'
                + '<div class="raffle-card__title">' + escapeHtml(r.title) + '</div>'
                + '<div class="raffle-card__meta">' + dateStr + (price ? ' · ' + price : '') + '</div>'
                + '<a href="' + (r.raffle_url||'#') + '" target="_blank" rel="noopener" class="raffle-card__btn">Participer au raffle</a>'
                + '</div></div>';
            }).join('');
          }
          // Carousel : toutes les raffles en scroll horizontal
          if (compact) {
            var carouselHtml = '<div class="raffle-carousel">';
            raffles.forEach(function(rf) {
              var dateStrRf = '';
              if (rf.date && rf.date !== 'TBD') {
                var prf = rf.date.split('-');
                var drf = new Date(parseInt(prf[0]), parseInt(prf[1])-1, parseInt(prf[2]));
                dateStrRf = 'Drop le ' + drf.toLocaleDateString('fr-FR', {day:'numeric', month:'long'});
              }
              var rfLink = rf.id ? 'sorties/' + rf.id + '.html' : (rf.raffle_url || rf.wtc_url || '#');
              carouselHtml += '<div class="raffle-carousel-item">'
                + (rf.image_url ? '<img src="' + rf.image_url + '" alt="' + escapeHtml(rf.title) + '" class="raffle-carousel-item__img" loading="lazy">' : '<div class="raffle-carousel-item__img"></div>')
                + '<div class="raffle-carousel-item__body">'
                + '<span class="raffle-carousel-item__badge">Raffle</span>'
                + '<div class="raffle-carousel-item__title">' + escapeHtml(rf.title) + '</div>'
                + '<div class="raffle-carousel-item__meta">' + dateStrRf + '</div>'
                + '<a href="' + rfLink + '" class="raffle-carousel-item__btn">Voir les raffles</a>'
                + '</div></div>';
            });
            carouselHtml += '</div>';
            compact.innerHTML = carouselHtml;
          }
        })();

        if (!allReleases.length) { if (empty) empty.style.display = 'block'; return; }
        var upcoming = allReleases.filter(function(r) { return isFutureOrToday(r.date); });
        var byScore = sortByScore(upcoming);
        renderTopPick(byScore[0]);
        render();
      })
      .catch(function(err) {
        if (loading) loading.style.display = 'none';
        console.error('Erreur releases:', err);
        if (empty) empty.style.display = 'block';
      });
  })();
  </script>

  <script>
  var BSTN_AWIN_MID='104979';
  var BSTN_AWIN_AFF='2855487';
  var BSTN_API_URL='https://searcht.bstn.com/collections/magento2_eu_products/documents/search';
  var BSTN_API_KEY='NCZstZEMLnMy4MSLPh9NKNrtMLsEF1Zy';
  var BSTN_SITE='https://www.bstn.com/';
  var _bstnCache={};
  function bstnAwinUrl(productPath){ return 'https://www.awin1.com/cread.php?awinmid='+BSTN_AWIN_MID+'&awinaffid='+BSTN_AWIN_AFF+'&p='+encodeURIComponent(BSTN_SITE+productPath); }
  function bstnCheckSku(sku,cb){
    if (!sku) return;
    var skuKey=sku.toLowerCase();
    if (_bstnCache[skuKey]!==undefined){ if (_bstnCache[skuKey]) cb(_bstnCache[skuKey]); return; }
    var skuNorm=skuKey.replace(/-/g,'');
    var q=skuKey.replace(/-/g,' ');
    var url=BSTN_API_URL+'?q='+encodeURIComponent(q)+'&query_by=name&per_page=5&filter_by=price_default%3A%3E0';
    fetch(url,{headers:{'X-TYPESENSE-API-KEY':BSTN_API_KEY}})
      .then(function(r){ return r.json(); })
      .then(function(data){
        var hits=data.hits||[];
        for (var i=0;i<hits.length;i++){
          var doc=hits[i].document;
          var docUrl=(doc.url||'').toLowerCase();
          if (docUrl.indexOf(skuNorm)!==-1){ var awinUrl=bstnAwinUrl(doc.url); _bstnCache[skuKey]=awinUrl; cb(awinUrl); return; }
        }
        _bstnCache[skuKey]=null;
      }).catch(function(){ _bstnCache[skuKey]=null; });
  }
  function bstnInjectBtn(container,awinUrl,label){
    if (!container||container.querySelector('.btn-bstn-aff')) return;
    var btn=document.createElement('a');
    btn.href=awinUrl; btn.target='_blank'; btn.rel='noopener sponsored';
    btn.className='btn-bstn-aff'; btn.textContent=label||'Acheter sur BSTN';
    btn.onclick=function(){ trackBSTN(container.closest('[data-title]')?container.closest('[data-title]').getAttribute('data-title'):'bstn'); };
    container.appendChild(btn);
  }
  (function(){
    var observer=new MutationObserver(function(mutations){
      mutations.forEach(function(m){
        m.addedNodes.forEach(function(node){
          if (node.nodeType!==1) return;
          var cards=node.matches&&node.matches('.drop-card')?[node]:Array.from(node.querySelectorAll('.drop-card[data-sku]'));
          cards.forEach(function(card){
            var sku=card.getAttribute('data-sku');
            if (!sku) return;
            var ctaDiv=card.querySelector('.drop-card__cta');
            bstnCheckSku(sku,function(url){ bstnInjectBtn(ctaDiv,url,'Acheter sur BSTN'); });
          });
        });
      });
    });
    var grids=['releases-grid-week','releases-grid-today','releases-grid-upcoming'];
    grids.forEach(function(id){ var el=document.getElementById(id); if (el) observer.observe(el,{childList:true,subtree:true}); });
  })();
  </script>

  <script>
  function renderPastGrid(data){
    var pastGrid=document.getElementById('past-grid');
    var btn=document.getElementById('btn-past');
    if (!data.length){
      pastGrid.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Aucune ancienne sortie disponible.</p>';
    } else {
      // Filtrer les past sans image utilisable — pas de fallback emoji violet 👟 dans la grille.
      data = data.filter(function(r) { return r.image_url && String(r.image_url).trim() !== ''; });
      if (!data.length) {
        pastGrid.innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">Aucune ancienne sortie disponible.</p>';
        pastGrid.style.display='block';
        btn.textContent='🔼 Masquer les anciennes sorties';
        return;
      }
      var html='<div class="cards-grid">';
      data.forEach(function(r){
        var img='<img src="'+r.image_url+'" class="drop-card__img" loading="lazy" onerror="window.sdfHideBrokenCard&&window.sdfHideBrokenCard(this)">';
        var hasLink=(r.retailers&&r.retailers.length)||r.buy_url||r.wtc_url;
        var articleUrl=(r.id&&hasLink)?'sorties/'+r.id+'.html':null;
        var imgWrap=articleUrl
          ?'<a href="'+articleUrl+'" class="drop-card__img-wrap" style="display:block">'+img+'</a>'
          :'<div class="drop-card__img-wrap">'+img+'</div>';
        var titleWrap=articleUrl
          ?'<a href="'+articleUrl+'" style="color:inherit"><h3 class="drop-card__title">'+escapeHtml(r.title)+(r.colorway?' <span style="opacity:.55;font-weight:700">('+escapeHtml(r.colorway)+')</span>':'')+'</h3></a>'
          :'<h3 class="drop-card__title">'+escapeHtml(r.title)+(r.colorway?' <span style="opacity:.55;font-weight:700">('+escapeHtml(r.colorway)+')</span>':'')+'</h3>';
        var ctaHref=r.link||articleUrl||'#';
        var ctaTarget=(articleUrl&&!r.link)?'':' target="_blank" rel="noopener"';
        html+='<article class="drop-card">'+imgWrap+'<div class="drop-card__body"><div class="drop-card__brand">'+(r.brand||r.source||'')+'</div>'+titleWrap+'<div class="drop-card__meta"><span>'+(r.date||'TBD')+'</span><span class="drop-card__price">'+(r.price||'')+'</span></div><a href="'+ctaHref+'"'+ctaTarget+' class="drop-card__cta btn-cop">Voir la paire</a></div></article>';
      });
      html+='</div>';
      pastGrid.innerHTML=html;
    }
    pastGrid.style.display='block';
    btn.textContent='🔼 Masquer les anciennes sorties';
  }
  function loadPastReleases(){
    var btn=document.getElementById('btn-past');
    var pastGrid=document.getElementById('past-grid');
    if (pastGrid.style.display==='block'){ pastGrid.style.display='none'; btn.textContent='🕐 Voir les anciennes sorties'; return; }
    btn.textContent='Chargement...';
    fetch('https://raw.githubusercontent.com/sneakerdropfr/sneakerdropfr.github.io/main/releases_past.json?t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(data){ renderPastGrid(data); })
      .catch(function(){ renderPastGrid([]); btn.textContent='🕐 Voir les anciennes sorties'; });
  }
  </script>
