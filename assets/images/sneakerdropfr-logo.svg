<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Fond blanc -->
  <circle cx="250" cy="250" r="245" fill="white" stroke="#CC2222" stroke-width="10"/>
  <!-- Cercle intérieur trait fin -->
  <circle cx="250" cy="250" r="225" fill="none" stroke="#111111" stroke-width="3"/>
  <!-- Cercle extérieur deuxième -->
  <circle cx="250" cy="250" r="238" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- SNEAKER en haut -->
  <text x="250" y="155" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="54" fill="#111111" text-anchor="middle" letter-spacing="8">SNEAKER</text>

  <!-- DROP grand et rouge -->
  <text x="250" y="265" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="130" fill="#CC2222" text-anchor="middle" letter-spacing="2">DROP</text>

  <!-- Ligne sous DROP -->
  <line x1="90" y1="280" x2="410" y2="280" stroke="#CC2222" stroke-width="4"/>

  <!-- • FR • -->
  <text x="250" y="340" font-family="Arial Black, Arial, sans-serif" font-weight="900"
        font-size="50" fill="#CC2222" text-anchor="middle" letter-spacing="6">• FR •</text>

  <!-- sneakerdropfr.fr en bas -->
  <text x="250" y="400" font-family="Arial, sans-serif" font-weight="400"
        font-size="26" fill="#333333" text-anchor="middle" letter-spacing="2">sneakerdropfr.fr</text>
</svg>
