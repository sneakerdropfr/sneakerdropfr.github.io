<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sneakers Nike 2026 — Dates de sortie & Prix | SneakerDrop FR</title>
  <meta name="description" content="Toutes les sorties Nike 2026 — Air Max, Dunk, Air Force 1, Pegasus. Dates de sortie, prix retail et où acheter en France.">
  <meta property="og:title" content="Sneakers Nike 2026 | SneakerDrop FR">
  <meta property="og:description" content="Toutes les sorties Nike 2026 — Air Max, Dunk, Air Force 1, Pegasus. Dates de sortie, prix retail et où acheter en France.">
  <meta property="og:url" content="https://sneakerdropfr.fr/categories/nike.html">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://sneakerdropfr.fr/categories/nike.html">
  <link rel="stylesheet" href="/style.css">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --accent:#FF2D2D;--pink:#FF2D2D;--black:#0A0A0A;--white:#FFFFFF;
      --bg:#FFFFFF;--bg-alt:#F5F5F5;--text:#0A0A0A;--muted:#777;
      --border:#E5E5E5;--shadow:0 2px 12px rgba(0,0,0,0.07);
      --shadow-hover:0 8px 28px rgba(0,0,0,0.11);--r:12px;
      --font-display:'Bebas Neue',sans-serif;
      --font-body:'Barlow',sans-serif;
      --font-cond:'Barlow Condensed',sans-serif;
    }
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:72px}
    a{text-decoration:none;color:inherit}
    img{max-width:100%;display:block}
    .container{max-width:1100px;margin:0 auto;padding:0 1.5rem}
    /* Header */
    .cat-header-nav{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:100}
    .cat-header-nav a{font-family:var(--font-cond);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:var(--black)}
    /* Hero */
    .cat-hero{text-align:center;padding:2.5rem 1.5rem 1.5rem}
    .cat-hero__label{font-family:var(--font-cond);font-size:.7rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
    .cat-hero__title{font-family:var(--font-display);font-size:3.5rem;letter-spacing:.03em;text-transform:uppercase;line-height:1}
    .cat-hero__count{font-family:var(--font-cond);font-size:.85rem;color:var(--muted);margin-top:.5rem}
    /* Nav */
    .cat-nav{display:flex;gap:.5rem;padding:.75rem 1.5rem;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
    .cat-nav::-webkit-scrollbar{display:none}
    .cat-nav a{font-family:var(--font-cond);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:.4rem 1rem;border-radius:999px;border:1.5px solid var(--border);white-space:nowrap;color:var(--muted);transition:all .15s}
    .cat-nav a.active,.cat-nav a:hover{background:var(--black);color:#fff;border-color:var(--black)}
    /* Grid */
    .cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;padding:1.5rem;max-width:1100px;margin:0 auto}
    @media(max-width:700px){.cat-grid{grid-template-columns:1fr;gap:1rem}}
    /* Card */
    .cat-card{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:box-shadow .2s,transform .2s;display:flex;flex-direction:column}
    .cat-card:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
    .cat-card__img-link{display:block;position:relative;height:180px;overflow:hidden;background:#f5f5f5}
    .cat-card__img-link img{width:100%;height:100%;object-fit:contain}
    .cat-badge{position:absolute;top:.5rem;left:.5rem;font-family:var(--font-cond);font-size:.6rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .5rem;border-radius:3px;z-index:2}
    .cat-badge--hype{background:#FF2D2D;color:#fff}
    .cat-badge--today{background:#0A0A0A;color:#E8FF00}
    .cat-badge--past{background:#777;color:#fff}
    .cat-card__body{padding:.9rem;flex:1;display:flex;flex-direction:column;gap:.3rem}
    .cat-card__brand{font-family:var(--font-cond);font-size:.65rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .cat-card__title{font-family:var(--font-display);font-size:.9rem;text-transform:uppercase;margin:.2rem 0 .5rem;line-height:1.2}
    .cat-card__title a{text-decoration:none;color:var(--black)}
    .cat-card__infos{display:flex;gap:.75rem;margin-bottom:.6rem}
    .cat-card__date{font-family:var(--font-cond);font-size:.7rem;color:var(--muted)}
    .cat-card__price{font-family:var(--font-cond);font-size:.8rem;font-weight:900;color:var(--black)}
    .cat-card__retailers{display:flex;flex-wrap:wrap;gap:.3rem}
    .cat-card__ret-btn{font-family:var(--font-cond);font-size:.55rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.25rem .55rem;border:1.5px solid var(--border);border-radius:3px;text-decoration:none;color:var(--black);white-space:nowrap}
    .cat-card__ret-btn:hover{background:var(--black);color:#fff}
    /* Section titre */
    .cat-section-title{font-family:var(--font-display);font-size:1.6rem;letter-spacing:.04em;text-transform:uppercase;padding:1.5rem 1.5rem .5rem;max-width:1100px;margin:0 auto}
    /* Btn past */
    #btn-past{background:var(--black);border:2px solid var(--black);color:#fff;padding:.75rem 2rem;border-radius:999px;font-family:var(--font-cond);font-weight:900;font-size:.95rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%;max-width:360px;display:block;margin:1.5rem auto;transition:background .15s,color .15s,border-color .15s}
    #btn-past:hover{background:var(--accent);border-color:var(--accent);color:var(--black)}
    /* Loading */
    .cat-loading{text-align:center;padding:3rem;color:var(--muted);font-family:var(--font-cond);font-size:.9rem;letter-spacing:.08em}
  </style>
</head>
<body>
  <header class="cat-header-nav">
    <a href="/">← ACCUEIL</a>
    <a href="/" style="font-size:1rem;font-weight:900;">SneakerDrop<span style="color:#e63946">FR</span></a>
    <a href="/sorties.html">TOUS LES DROPS</a>
  </header>

  <div class="cat-hero">
    <div class="cat-hero__label">Catégorie</div>
    <h1 class="cat-hero__title">Nike</h1>
    <p class="cat-hero__count" id="cat-count">Chargement...</p>
  </div>

  <nav class="cat-nav">
    <a href="/categories/jordan.html">Jordan</a>
    <a href="/categories/nike.html" class='active'>Nike</a>
    <a href="/categories/adidas.html">Adidas</a>
    <a href="/categories/new-balance.html">New Balance</a>
  </nav>

  <div class="cat-section-title">Prochaines sorties</div>
  <main class="cat-grid" id="upcoming-grid">
    <div class="cat-loading">Chargement des drops...</div>
  </main>

  <button id="btn-past" onclick="loadPastCat()">🕐 Voir les anciennes sorties</button>
  <div class="cat-section-title" id="past-title" style="display:none">Anciennes sorties</div>
  <div class="cat-grid" id="past-grid"></div>

  <footer style="text-align:center;padding:2rem;font-family:var(--font-cond);font-size:.75rem;color:var(--muted);border-top:1px solid var(--border);">
    © 2026 SneakerDrop FR — <a href="/privacy.html" style="color:var(--muted)">Confidentialité</a>
  </footer>

  <script>
  var BRAND_KEYS = ['nike'];

  function matchBrand(brand) {
    if (!brand) return false;
    var b = brand.toLowerCase();
    return BRAND_KEYS.some(function(k) { return b.indexOf(k) !== -1; });
  }

  function fmtDate(d) {
    if (!d || d === 'TBD') return 'Date TBD';
    var p = d.split('-');
    if (p.length !== 3) return d;
    var months = ['jan','fév','mar','avr','mai','jun','jul','aoû','sep','oct','nov','déc'];
    return p[2] + ' ' + months[+p[1]-1] + '. ' + p[0];
  }

  function fmtPrice(p) {
    if (!p || p === 'TBD') return '';
    var n = String(p).replace(/€/g,'').trim();
    return n ? n + '€' : '';
  }

  function renderCard(r, isPast) {
    var badge = '';
    if (!isPast && r.featured) badge = '<span class="cat-badge cat-badge--hype">🔥 Top Pick</span>';
    else if (r.hype_score >= 80) badge = '<span class="cat-badge cat-badge--hype">🔥 Hype</span>';
    if (isPast) badge = '<span class="cat-badge cat-badge--past">Sortie</span>';

    var retailers = '';
    if (r.retailers && r.retailers.length) {
      var shown = r.retailers.slice(0,3);
      shown.forEach(function(rt) {
        var price = fmtPrice(rt.price);
        retailers += '<a href="' + (rt.url||'#') + '" target="_blank" rel="noopener nofollow sponsored" class="cat-card__ret-btn">' + (rt.name||'') + (price?' '+price:'') + '</a>';
      });
      if (r.retailers.length > 3) {
        retailers += '<a href="/sorties/' + r.id + '.html" class="cat-card__ret-btn" style="border-style:dashed;color:var(--muted)">+' + (r.retailers.length-3) + ' voir tout →</a>';
      }
    }

    var img = r.image_url || '';
    var price = fmtPrice(r.price);
    var date = fmtDate(r.date);
    var brand = r.brand || '';

    return '<article class="cat-card">'
      + '<a href="/sorties/' + r.id + '.html" class="cat-card__img-link">'
      + badge
      + (img ? '<img src="' + img + '" alt="' + (r.title||'').replace(/"/g,'') + '" loading="lazy">' : '')
      + '</a>'
      + '<div class="cat-card__body">'
      + '<div class="cat-card__brand">' + brand + '</div>'
      + '<h2 class="cat-card__title"><a href="/sorties/' + r.id + '.html">' + (r.title||'') + '</a></h2>'
      + '<div class="cat-card__infos">'
      + '<span class="cat-card__date">📅 ' + date + '</span>'
      + (price ? '<span class="cat-card__price">' + price + '</span>' : '')
      + '</div>'
      + (retailers ? '<div class="cat-card__retailers">' + retailers + '</div>' : '')
      + '</div>'
      + '</article>';
  }

  var _pastLoaded = false;

  function loadPastCat() {
    var btn = document.getElementById('btn-past');
    var grid = document.getElementById('past-grid');
    var title = document.getElementById('past-title');

    if (grid.style.display === 'grid') {
      grid.style.display = 'none';
      title.style.display = 'none';
      btn.textContent = '🕐 Voir les anciennes sorties';
      return;
    }

    if (_pastLoaded) {
      grid.style.display = 'grid';
      title.style.display = 'block';
      btn.textContent = '🔼 Masquer les anciennes sorties';
      return;
    }

    btn.textContent = 'Chargement...';

    fetch('https://raw.githubusercontent.com/sneakerdropfr/sneakerdropfr.github.io/main/releases_past.json?t=' + Date.now())
      .then(function(r) { return r.json(); })
      .catch(function() { return []; })
      .then(function(data) {
        var filtered = data.filter(function(r) { return matchBrand(r.brand); });
        filtered.sort(function(a,b) {
          if (!a.date || a.date==='TBD') return 1;
          if (!b.date || b.date==='TBD') return -1;
          return b.date.localeCompare(a.date);
        });
        if (!filtered.length) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:2rem;font-family:var(--font-cond)">Aucune ancienne sortie disponible.</p>';
        } else {
          grid.innerHTML = filtered.map(function(r) { return renderCard(r, true); }).join('');
        }
        _pastLoaded = true;
        grid.style.display = 'grid';
        title.style.display = 'block';
        btn.textContent = '🔼 Masquer les anciennes sorties';
      });
  }

  // Charger les drops à venir
  fetch('https://raw.githubusercontent.com/sneakerdropfr/sneakerdropfr.github.io/main/releases.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .catch(function() { return []; })
    .then(function(data) {
      var today = new Date(); today.setHours(0,0,0,0);
      var filtered = data.filter(function(r) {
        return matchBrand(r.brand) && r.date && r.date !== 'TBD';
      });
      // Trier par date asc
      filtered.sort(function(a,b) { return a.date.localeCompare(b.date); });
      var grid = document.getElementById('upcoming-grid');
      var count = document.getElementById('cat-count');
      if (!filtered.length) {
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--muted);padding:2rem;font-family:var(--font-cond)">Aucune sortie à venir pour le moment.</p>';
        count.textContent = '0 paire à venir';
      } else {
        grid.innerHTML = filtered.map(function(r) { return renderCard(r, false); }).join('');
        count.textContent = filtered.length + ' paire' + (filtered.length > 1 ? 's' : '') + ' à venir';
      }
    });
  </script>

  <script type="text/javascript" src="https://s.skimresources.com/js/302926X179095.skimlinks.js"></script>
</body>
</html>
